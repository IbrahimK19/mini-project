<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Guest P2P Watch Party</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        h1 {
            margin-bottom: 5px;
            color: #38bdf8;
        }
        .role-selector, .controls {
            margin-bottom: 15px;
            display: flex;
            gap: 10px;
            align-items: center;
        }
        button, input[type="file"] {
            background: #1e293b;
            color: #38bdf8;
            border: 1px solid #38bdf8;
            padding: 8px 16px;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        button:hover {
            background: #38bdf8;
            color: #0f172a;
        }
        .hidden {
            display: none !important;
        }
        .video-container {
            position: relative;
            width: 100%;
            max-width: 800px;
            background: #000;
            border-radius: 8px;
            overflow: hidden;
            box-shadow: 0 10px 25px rgba(0, 0, 0, 0.5);
        }
        video {
            width: 100%;
            height: auto;
            display: block;
        }
        #videoLoader {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(10, 10, 15, 0.9);
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            color: #00ffcc;
            font-family: monospace;
            border-radius: 8px;
            transition: opacity 0.5s ease;
            z-index: 10;
        }
    </style>
</head>
<body>

    <h1>P2P Watch Party Hub</h1>
    
    <!-- Role Selection View -->
    <div id="roleSelection" class="role-selector">
        <p>Choose your role:</p>
        <button id="hostRoleBtn">Host Room</button>
        <button id="guestRoleBtn">Join as Guest</button>
    </div>

    <!-- Host Specific Controls -->
    <div id="hostControls" class="controls hidden">
        <input type="file" id="videoFilePicker" accept="video/mp4">
        <span id="peerCount" style="color: #38bdf8; font-family: monospace;">Connected Peers: 0</span>
    </div>

    <!-- Guest Specific Controls -->
    <div id="guestControls" class="controls hidden">
        <span id="guestStatusLabel" style="color: #38bdf8; font-family: monospace;">Status: Connecting to room...</span>
    </div>

    <div class="video-container">
        <video id="localVideo" controls playsinline></video>
        
        <div id="videoLoader">
            <div style="font-size: 18px; font-weight: bold; margin-bottom: 10px;">📥 P2P Watch Party</div>
            <div id="loaderText" style="font-size: 14px; color: #a5f3fc;">Select your role above to begin...</div>
        </div>
    </div>

    <script src="app.js"></script>
</body>
</html>
